spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/jpashop
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create #애플리케이션 실행 시 생성함(이미있다면 지우고 재생성)
    properties:
      hibernate:
#        show_sql: true  ← system.out에서 출력(자바 표준)
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug #  ← SLF4J / Logback 등의 로깅 시스템에서 출력
    org.hibernate.orm.jdbc.bind: trace